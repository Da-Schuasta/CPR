// ---- Öffentliche API: window.sheet.setValues({FELDNAME: "wert"}) / getValues() ----
const els = {};
const root = document.getElementById('root');
const BG_DIR = ''; // Pfad zu den Hintergrundbildern anpassen, z.B. '/assets/sheets/'
SHEET.pages.forEach(pg=>{
  const d=document.createElement('div'); d.className='page'; d.dataset.w=pg.width_pt;
  d.style.aspectRatio=pg.width_pt+'/'+pg.height_pt; d.style.width=(pg.width_pt/1190.55*100)+'%'; 
  d.style.maxWidth=(pg.width_pt/pg.height_pt*100*8.41)+'vw';
  const im=new Image(); im.src=BG_DIR+pg.background; im.alt=''; d.appendChild(im);
  SHEET.fields.filter(f=>f.page===pg.page).forEach(f=>{
    let e;
    if(f.type==='checkbox'){e=document.createElement('input');e.type='checkbox';e.style.setProperty('--c',f.color||'#fff');}
    else if(f.type==='textarea'){e=document.createElement('textarea');}
    else if(f.type==='text'){e=document.createElement('input');e.type='text';}
    else if(f.type==='button'){e=document.createElement('div');e.dataset.img=1;e.style.cursor='pointer';e.style.backgroundSize='cover';e.style.backgroundPosition='center';
      e.onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const r=new FileReader();r.onload=()=>{e.style.backgroundImage='url('+r.result+')';e.dataset.src=r.result;};r.readAsDataURL(i.files[0]);};i.click();};}
    else return;
    e.className='f'; e.name=f.name; e.title=f.tooltip||f.name;
    Object.assign(e.style,{left:f.x_pct+'%',top:f.y_pct+'%',width:f.w_pct+'%',height:f.h_pct+'%',
      color:f.color||'#fff',textAlign:f.align||'left'});
    e.dataset.pt=f.font_size_pt||0; e.dataset.h=f.rect_pt[3]-f.rect_pt[1];
    if(f.max_len) e.maxLength=f.max_len;
    if(f.readonly) e.readOnly=true;
    if(f.default!==undefined && f.type!=='checkbox') e.value=f.default;
    e.addEventListener('input',recalc); e.addEventListener('change',recalc);
    els[f.name]=e; d.appendChild(e);
  });
  root.appendChild(d);

function fit(){ // Schriftgröße proportional zur Seitenbreite skalieren
  document.querySelectorAll('.page').forEach(p=>{
    const u=p.clientWidth/p.dataset.w;
    p.querySelectorAll('.f').forEach(e=>{
      const pt=+e.dataset.pt, h=+e.dataset.h;
      const size = pt>0 ? pt : Math.min(14, h*0.62);
      e.style.fontSize=(size*u)+'px';
      if(e.type==='checkbox') e.style.lineHeight=(h*u)+'px';
    });
  });
}
addEventListener('resize',fit);
// ---- Berechnungen (aus den PDF-JavaScripts übernommen: SUM / PRD) ----
function num(n){const e=els[n]; if(!e) return 0; const v=parseFloat(String(e.value).replace(',','.')); return isNaN(v)?0:v;}
function recalc(){
  for(let pass=0;pass<3;pass++) SHEET.calculations.forEach(c=>{
    const e=els[c.target]; if(!e) return;
    let r = c.op==='SUM' ? c.inputs.reduce((a,n)=>a+num(n),0) : c.inputs.reduce((a,n)=>a*num(n),1);
    e.value=r;
  });
}
const calcTargets=new Set(SHEET.calculations.map(c=>c.target));
const api={
  getValues(){const o={};for(const[n,e]of Object.entries(els)){if(calcTargets.has(n))continue;o[n]=e.type==='checkbox'?e.checked:(e.dataset.img?(e.dataset.src||''):e.value);}return o;},
  setValues(o){for(const[n,v]of Object.entries(o)){const e=els[n];if(!e)continue;if(e.type==='checkbox')e.checked=!!v;else if(e.dataset.img){e.dataset.src=v;e.style.backgroundImage=v?'url('+v+')':'';}else e.value=v;}recalc();},
  reset(){for(const e of Object.values(els)){if(e.type==='checkbox')e.checked=false;else if(e.dataset.img){e.dataset.src='';e.style.backgroundImage='';}else e.value='';}recalc();}
};
window.sheet=api;
document.getElementById('save').onclick=()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(api.getValues(),null,1)],{type:'application/json'}));
  a.download=(els['NAME1']?.value||SHEET.sheet)+'.json';a.click();};
document.getElementById('load').onchange=async ev=>{api.setValues(JSON.parse(await ev.target.files[0].text()));};
